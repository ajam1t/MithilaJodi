name: CI

# Nothing previously prevented a broken or type-unsafe commit reaching
# production. This runs the checks the project already has — type-check, lint
# and a real production build — on every push and pull request.
#
# No new dependencies: it uses the existing npm scripts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Type-check
        run: npm run type-check --workspace=@mithila-jodi/web

      - name: Lint
        run: npm run lint --workspace=@mithila-jodi/web

      # The build type-checks and lints again, and catches route/runtime
      # regressions the other two steps cannot see. Placeholder Supabase values
      # are enough: no page is pre-rendered against a live database.
      - name: Build
        run: npm run build --workspace=@mithila-jodi/web
        env:
          NEXT_PUBLIC_SITE_URL: https://mithilajodi.com
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

      # Guard the settings that previously defaulted to unsafe values.
      #
      # There are TWO .env.example files (repo root and apps/web) and they had
      # drifted apart — the root one was fixed while apps/web still shipped
      # DEV_OTP_ENABLED=true, which is the file a developer working in apps/web
      # actually copies. Check every one of them, found dynamically so a third
      # copy cannot slip past this guard either.
      - name: Assert unsafe defaults stay off
        run: |
          set -e
          examples=$(git ls-files '*.env.example' '.env.example')
          if [ -z "$examples" ]; then
            echo "::error::no .env.example found — this guard is silently passing"; exit 1
          fi
          echo "checking: $examples"
          for f in $examples; do
            if grep -qE '^DEV_OTP_ENABLED=true' "$f"; then
              echo "::error file=$f::must not default DEV_OTP_ENABLED to true"; exit 1
            fi
            if grep -qE '^DEV_AUTH_MODE=true' "$f"; then
              echo "::error file=$f::must not default DEV_AUTH_MODE to true"; exit 1
            fi
            if grep -qE '^FREE_ACCESS_MODE=' "$f"; then
              echo "::error file=$f::FREE_ACCESS_MODE is retired; use PAID_MEMBERSHIPS_ENABLED"; exit 1
            fi
          done
          echo "env defaults OK"

      # The platform is free; live payment-execution endpoints must not come back
      # without a deliberate decision. The PaymentGateway seam in
      # lib/services/payment/ is intentionally kept and is NOT matched here.
      - name: Assert payment-execution endpoints stay removed
        run: |
          set -e
          if git ls-files | grep -qE 'app/api/(membership/(orders|verify)|webhooks/razorpay)/'; then
            echo "::error::payment-execution endpoints were reintroduced; see lib/membership.ts"; exit 1
          fi
          echo "payment surface OK"
